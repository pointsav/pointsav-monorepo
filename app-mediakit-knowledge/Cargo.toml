# app-mediakit-knowledge — ground-up rewrite of the knowledge wiki engine.
# Renamed from app-mediakit-knowledge-2 at cutover (plan P8).
# 100% new code. Only third-party crates are shared with the retired engine.
[package]
name = "app-mediakit-knowledge"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "PointSav knowledge wiki engine. Single binary, flat-file Markdown source-of-truth, Git-versioned, Wikipedia-structured."
license = "Apache-2.0"
publish = false

[[bin]]
name = "app-mediakit-knowledge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Deps grow phase by phase (see plan virtual-twirling-parasol P0–P5).
# P0/P1 set: HTTP stack, templating, config, markdown, embedded assets.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "set-header", "compression-br", "compression-gzip"] }
maud = { version = "0.27", features = ["axum"] }
comrak = { version = "0.52", features = ["syntect"] }
syntect = "5"
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tantivy = "0.24"
git2 = { version = "0.20", default-features = false }
# default-features off: only local repo history/diff (src/history.rs — Repository,
# DiffOptions, Sort, Commit) is used, never clone/fetch/push, so the "https"/"ssh"
# defaults (openssl-sys/libssh2-sys) are pure dead weight. They also break the
# os-mediakit aarch64 cross-compile (openssl-sys has no cross pkg-config sysroot on
# this host) — found and fixed 2026-08-26.
# P9 (claim layer): embedded claim-graph store, content hashing, citation
# re-verification HTTP client, and the MCP query surface.
redb = "4"
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rmcp = { version = "2", features = ["transport-io", "schemars"] }
schemars = "1"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# build.rs (Phase 4: DTCG token pipeline) parses tokens/design-tokens.json.
[build-dependencies]
serde_json = "1"
