[package]
name = "moonshot-folio-layout"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "moonshot-folio L3: IR to `PageTree`"

[dependencies]
moonshot-folio-core = { path = "../core" }
moonshot-folio-ir = { path = "../ir" }
moonshot-folio-tokens = { path = "../tokens" }
moonshot-folio-font = { path = "../font" }
moonshot-folio-text = { path = "../text" }
moonshot-folio-draw = { path = "../draw" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
