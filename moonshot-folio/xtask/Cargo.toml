[package]
name = "moonshot-folio-xtask"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "moonshot-folio assurance gates (std only)"

[[bin]]
name = "folio-xtask"
path = "src/main.rs"

[dependencies]
moonshot-folio-codec = { path = "../crates/codec" }
moonshot-folio-core = { path = "../crates/core" }
moonshot-folio-font = { path = "../crates/font" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
