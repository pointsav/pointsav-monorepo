[package]
name = "moonshot-folio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "moonshot-folio facade: render(&Document, Target) -> Artifact"

[dependencies]
moonshot-folio-ir = { path = "crates/ir" }
moonshot-folio-tokens = { path = "crates/tokens" }
moonshot-folio-pdf = { path = "crates/pdf" }
moonshot-folio-docx = { path = "crates/docx" }
moonshot-folio-xlsx = { path = "crates/xlsx" }
moonshot-folio-html = { path = "crates/html" }
moonshot-folio-csv = { path = "crates/csv" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/codec",
    "crates/ir",
    "crates/tokens",
    "crates/font",
    "crates/text",
    "crates/draw",
    "crates/fonts-tinos",
    "crates/raster",
    "crates/layout",
    "crates/pdf",
    "crates/docx",
    "crates/xlsx",
    "crates/html",
    "crates/csv",
    "crates/conform",
]
