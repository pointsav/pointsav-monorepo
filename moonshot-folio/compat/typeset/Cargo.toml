[package]
name = "moonshot-folio-compat-typeset"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "moonshot-folio compat: tool_typeset::Doc to folio IR (strangler adapter; deliberately outside the family workspace)"

# Own workspace: the family workspace stays free of tool-typeset, and the family core never
# depends on it. Every dependency is first-party and a path dependency.
[workspace]

[dependencies]
moonshot-folio-core = { path = "../../crates/core" }
moonshot-folio-ir = { path = "../../crates/ir" }
tool-typeset = { path = "../../../tool-typeset" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
