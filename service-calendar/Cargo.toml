[package]
license = "Apache-2.0"
name = "service-calendar"
version = "0.1.0"
edition = "2021"

[dependencies]
worm-ledger = { path = "../worm-ledger" }
envelope = { path = "../envelope" }
dav-server = { version = "0.11", default-features = false, features = ["caldav"] }
icalendar = "0.17"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
uuid = { version = "1.6", features = ["v4"] }
rrule = "0.14.0"
chrono-tz = "0.10.4"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
