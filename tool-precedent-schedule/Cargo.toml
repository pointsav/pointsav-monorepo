[package]
name = "tool-precedent-schedule"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Critical-path-method scheduling for the tool-precedent-* family. Pure compute, moved from service-schedule's cpm module (BTreeMap swap only); no_std + alloc capable."

# Zero third-party dependencies by default, matching the tool-precedent-*
# bar. Callers that need JSON (service-schedule's HTTP daemon) enable `serde`.
[features]
default = ["std"]
std = ["serde?/std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
