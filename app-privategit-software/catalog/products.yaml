  - id: app-orchestration-command
    name: PointSav Orchestration Command Server
    description: Bootable seL4/Microkit appliance — invite-token pairing and fleet API hub for Totebox Orchestration, bundling a full GPU/model-brokering instance as its own managed child process
    edition: "0.1.0"
    platform: "aarch64 (seL4/Microkit appliance)"
    size_mb: 108
    path: app-orchestration-command/0.1.0
    license_tier: proprietary
    price_usdc: 0
    platform_slug: aarch64-unknown-linux-gnu
    tier: platform
    family: totebox_orchestration
    becomes: "Turns a machine into your fleet's command server — with a working AI broker built in."
    facts:
      - label: "RUNS AS"
        value: "Bootable appliance image, aarch64 under QEMU"
      - label: "SERVES"
        value: "Fleet invite-token pairing + archive API, plus a bundled GPU/model broker"
      - label: "USED BY"
        value: "project-command and project-orchestration today"
    bundled_registry_products: [app-orchestration-slm]
    artifact: appliance_image
    boot_notes: |
      This ships as a bootable seL4/Microkit/libvmm appliance image (loader.img), not
      a regular Linux binary — boot it under QEMU rather than running it directly.

      This is a consolidated image: the guest runs the fleet command server as the
      managed service, which spawns and supervises a full GPU/model-broker instance
      as its own child process — one boot gives you both.

      Real qemu invocation (adapt paths to wherever you place the downloaded image):

        qemu-system-aarch64 \
          -machine virt,virtualization=on,secure=off \
          -cpu cortex-a53 \
          -serial mon:stdio \
          -device loader,file=./aarch64-unknown-linux-gnu,addr=0x70000000,cpu-num=0 \
          -m size=2G \
          -nographic \
          -global virtio-mmio.force-legacy=false \
          -drive file=./blk_storage,format=raw,if=none,id=hd \
          -device virtio-blk-device,drive=hd,bus=virtio-mmio-bus.1 \
          -device virtio-net-device,netdev=netdev0,bus=virtio-mmio-bus.0 \
          -netdev user,id=netdev0,hostfwd=tcp::8020-:8020,hostfwd=tcp::9180-:9180

      This runs under TCG software emulation (no KVM/hardware-virt required — works
      on any host, including non-aarch64 hosts, but slower than native).

      Before first boot, create the data disk file referenced above — QEMU will not
      start without it:

        qemu-img create -f raw blk_storage 2G

      The guest formats this disk to ext4 itself automatically on first boot if it's
      blank, then mounts it directly on every later boot — your data genuinely
      persists across restarts as long as you keep reusing the same blk_storage file.

      Once booted, the command server is reachable at http://127.0.0.1:8020 and the
      bundled broker at http://127.0.0.1:9180 on the host (both forwarded from the
      guest).

      Known limitation: there is no supported host-side graceful shutdown for this
      image today — stopping the VM (Ctrl-C, kill, or equivalent) hard-kills the
      emulator process; there is no in-guest ACPI/power-button path to receive a
      shutdown request from the host side. Avoid stopping the VM while writes are
      actively in flight if you can avoid it.

  - id: app-mediakit-knowledge
    name: PointSav Knowledge Wiki
    description: Self-hosted Wikipedia-pattern wiki engine — documentation, projects, and corporate instances
    edition: "0.1.0"
    platform: "x86_64-unknown-linux-gnu"
    size_mb: 259
    path: app-mediakit-knowledge/0.1.0
    license_tier: apache
    price_usdc: 0
    platform_slug: linux-x86_64-qcow2
    tier: delivery
    family: independent
    becomes: "Turns a machine into your organisation's wiki."
    facts:
      - label: "RUNS AS"
        value: "qcow2 disk image, boots under QEMU"
      - label: "SERVES"
        value: "Web wiki on port 9090, forwarded to your host"
      - label: "PERSISTENCE"
        value: "All state in the one file you downloaded (copy-on-write)"
    artifact: appliance_image
    boot_notes: |
      This ships as a self-contained qcow2 disk image, not a regular Linux binary —
      boot it under QEMU rather than running it directly.

        qemu-system-x86_64 \
          -m 2G \
          -drive file=./linux-x86_64-qcow2,format=qcow2 \
          -netdev user,id=net0,hostfwd=tcp::9090-:9090 \
          -device virtio-net-pci,netdev=net0 \
          -nographic

      Add -enable-kvm if your host supports hardware virtualization (Linux host with
      /dev/kvm) for near-native speed; omit it to fall back to software emulation.

      The wiki engine binds to 127.0.0.1:9090 inside the guest by default (its own
      WIKI_BIND setting) — the hostfwd above forwards that to the same port on your
      host. Once booted, reach it at http://127.0.0.1:9090.

      Unlike the seL4 appliance images in this catalog, this is a standard qcow2
      image with no separate data-disk step — all state lives in the one file you
      downloaded, and qcow2's own copy-on-write format handles persistence across
      restarts natively.

