  # app-orchestration-slm REMOVED 2026-08-06 — os-* vs app-* storefront/registry
  # doctrine (conventions/soft-distribution-pipeline.md §1, amended 2026-07-02): the
  # public storefront sells os-* images only; app-*/service-* packages belong behind
  # the license-key-gated app-privategit-source registry, not as independent
  # storefront SKUs. SLM's functionality is now also bundled as a managed child
  # process inside app-orchestration-command's own appliance image (see that entry
  # above) — nothing about the SLM software changed, it's still real and still works,
  # it's just not sold twice. Folded into the registry: a app-orchestration-command
  # license key now also authorizes downloading app-orchestration-slm directly (see
  # its bundled_registry_products: field below, and LicensePayload.entitled_products
  # in app-privategit-software/app-privategit-release's main.rs) — its own
  # RELEASES_DIR/app-orchestration-slm/MANIFEST.json now requires a license
  # (requires_license: true) rather than serving it open.
